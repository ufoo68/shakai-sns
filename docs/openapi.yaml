openapi: 3.0.3
info:
  title: Shakai Public API
  version: 1.0.0
  description: 外部クライアント向けのバージョン付きREST API
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: example.com
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: 現在のユーザーを取得
      responses:
        '200':
          description: User
        '401':
          $ref: '#/components/responses/Unauthorized'
  /posts:
    get:
      summary: 投稿一覧を取得
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Feed items }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 投稿を作成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/profile:
    get:
      summary: 自分のプロフィールを取得
      responses:
        '200': { description: Profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: 自分のプロフィールを更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200': { description: Updated profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /profiles/{handle}:
    get:
      summary: プロフィールを取得
      parameters:
        - in: path
          name: handle
          required: true
          schema: { type: string }
      responses:
        '200': { description: Profile }
        '404': { description: Profile not found }
  /profiles/{handle}/follow:
    post:
      summary: プロフィールをフォロー
      parameters:
        - in: path
          name: handle
          required: true
          schema: { type: string }
      responses:
        '200': { description: Following state }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: プロフィールのフォローを解除
      parameters:
        - in: path
          name: handle
          required: true
          schema: { type: string }
      responses:
        '200': { description: Following state }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profiles/suggestions:
    get:
      summary: おすすめプロフィールを取得
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 3 }
      responses:
        '200': { description: Suggested profiles }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/avatar:
    post:
      summary: 自分のアバター画像を更新
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200': { description: Updated avatar URL }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: File too large }
        '415': { description: Unsupported image type }
  /me/books:
    get:
      summary: 自分の本棚を取得
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: status
          schema: { type: string, enum: [読んだ, 読んでいる, 読みたい] }
      responses:
        '200': { description: Books owned by the current user }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: 本を追加
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '201': { description: Created book }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/books/{id}:
    patch:
      summary: 本を編集
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '200': { description: Updated book }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Book not found }
    delete:
      summary: 本を削除
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted book }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Book not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Better-Auth-session-token
  schemas:
    ProfileInput:
      type: object
      properties:
        bio: { type: string, maxLength: 400 }
        currentThought: { type: string, maxLength: 400 }
        interests:
          type: array
          items: { type: string }
    PostInput:
      type: object
      required: [genre, division, form, title, body]
      properties:
        genre: { type: string }
        division: { type: string }
        form: { type: string }
        title: { type: string }
        body: { type: string }
    BookInput:
      type: object
      required: [title, status]
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 200 }
        translator: { type: string, maxLength: 200 }
        status: { type: string, enum: [読んだ, 読んでいる, 読みたい] }
        note: { type: string, maxLength: 2000, nullable: true }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
